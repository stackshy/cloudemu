name: "CloudEmu CodeQL config"

# go/sql-injection stays active across the whole repo (server, providers, core).
#
# The single exemption below is contrib/dockerengine/mysql/mysql.go — opt-in,
# local-only Docker dev tooling, NOT the wire server or the core library. Its
# MySQL engine must build DDL (CREATE DATABASE / GRANT) by string concatenation
# because SQL *identifiers* (database and user names) cannot be parameterized.
# Every identifier is validated against a strict allowlist and backtick-quoted
# through the single `quoteIdent` chokepoint, which is the injection barrier —
# but CodeQL's Go query cannot model a first-party allowlist helper as a
# sanitizer (a neutral model is ignored when the function's source is present,
# and pq-style library quoters have no MySQL equivalent). This file is exempt so
# that genuine false positives there don't block CI, without weakening the query
# anywhere else.
paths-ignore:
  - contrib/dockerengine/mysql/mysql.go
