name: CI

# Public repo → GitHub-hosted Actions are free. Kept fast: Build and Vet share
# one job so `go vet` reuses the compile cache `go build` just populated
# (standalone `go vet ./...` recompiles everything and is slow). Test runs in
# parallel; the quick checks (Tidy/Format) give sub-minute feedback. Every job
# restores the Go build+module cache. One run per PR (+ push to master);
# superseded runs cancel.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vet:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      # Manual cache with restore-keys so a changed go.sum still restores the
      # previous build+module cache (only the changed deps recompile) instead
      # of a full cold compile of the whole cloud-SDK dependency tree.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: go build
        run: go build ./...
      - name: go vet (reuses the build cache)
        run: go vet ./...

  contrib-testcontainers:
    name: Contrib (testcontainers)
    runs-on: ubuntu-latest
    # Separate Go module (keeps testcontainers-go out of the core module), so
    # the root build/vet doesn't cover it. Compile + vet only — the container
    # acceptance test needs Docker and is run on demand (go test ./...).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-contrib-${{ hashFiles('contrib/testcontainers/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-contrib-
      - name: build & vet
        working-directory: contrib/testcontainers
        run: |
          go build ./...
          go vet ./...

  contrib-realengine:
    name: Contrib (realengine)
    runs-on: ubuntu-latest
    # Separate Go module (keeps embedded-postgres out of the core module). Build
    # + vet only — the real-Postgres tests fetch a Postgres binary and run it,
    # so they are executed on demand (go test ./...), not on every CI run.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-realengine-${{ hashFiles('contrib/realengine/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-realengine-
      - name: build & vet
        working-directory: contrib/realengine
        run: |
          go build ./...
          go vet ./...

  contrib-dockerengine:
    name: Contrib (dockerengine)
    runs-on: ubuntu-latest
    # Separate Go module (keeps the docker-CLI-oriented deps out of the core
    # module). Build + vet + lint here; the real-container e2es (MySQL, compute,
    # containers, the Azure Functions host) shell out to the docker CLI and pull
    # multi-hundred-MB images, so — like realengine — they run on demand
    # (go test ./...), not on every CI run. ubuntu-latest ships Docker for that.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-dockerengine-${{ hashFiles('contrib/dockerengine/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-dockerengine-
      - name: build & vet
        working-directory: contrib/dockerengine
        run: |
          go build ./...
          go vet ./...
      - name: install golangci-lint v2
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin"
      - name: golangci-lint run (report-only)
        working-directory: contrib/dockerengine
        run: "$(go env GOPATH)/bin/golangci-lint run --timeout=9m ./... || echo '::warning::golangci-lint reported findings (advisory)'"

  contrib-server:
    name: Contrib (server)
    runs-on: ubuntu-latest
    # Separate Go module: the batteries-included wire server that composes the
    # real engines onto the wire servers. Build + vet + lint here; the real-engine
    # e2e (embedded Postgres + miniredis + real AWS SDK) fetches a Postgres binary
    # and runs it, so — like realengine/dockerengine — it runs on demand
    # (go test ./...), not on every CI run.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-server-${{ hashFiles('contrib/server/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-server-
      - name: build & vet
        working-directory: contrib/server
        run: |
          go build ./...
          go vet ./...
      # embedded-postgres downloads its Postgres binary on first run; cache it so
      # the CI-safe test tier (no docker socket needed — the E2E uses embedded
      # Postgres, the degrade tests run WITHOUT docker) doesn't refetch each run.
      - uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}
      # Advisory (report-only), matching the contrib-* convention: these tests
      # need no docker socket but the embedded-Postgres binary download can flake;
      # promote to blocking once proven stable.
      - name: go test (report-only)
        working-directory: contrib/server
        run: "go test -count=1 ./... || echo '::warning::contrib/server go test reported findings (advisory)'"
      - name: install golangci-lint v2
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin"
      - name: golangci-lint run (report-only)
        working-directory: contrib/server
        run: "$(go env GOPATH)/bin/golangci-lint run --timeout=9m ./... || echo '::warning::golangci-lint reported findings (advisory)'"
      # Only run the heavy multi-stage engines image build when the trees it is
      # built from change, so it doesn't fire on every repo PR.
      - name: filter engines-image paths
        id: engines_paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            engines:
              - 'contrib/server/**'
              - 'contrib/realengine/**'
              - 'contrib/dockerengine/**'
              - 'server/serverkit/**'
      - name: docker smoke build (engines image)
        if: steps.engines_paths.outputs.engines == 'true'
        run: docker build -f contrib/server/Dockerfile -t cloudemu-engines-test .

  contrib-terraform:
    name: Contrib (terraform)
    runs-on: ubuntu-latest
    # Separate Go module: the IaC-compatibility suite. Unlike the other contrib
    # e2es (which need Docker), this one needs only an OpenTofu binary and a
    # provider download, so — as the evidenced-IaC-compat proof — it actually
    # runs the real `tofu init/apply/plan/destroy` loop in CI, not just build+vet.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-terraform-${{ hashFiles('contrib/terraform/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-terraform-
      - name: build & vet
        working-directory: contrib/terraform
        run: |
          go build ./...
          go vet ./...
      - name: terraform compatibility e2e
        working-directory: contrib/terraform
        run: go test -timeout 15m ./...
      - name: install golangci-lint v2
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin"
      - name: golangci-lint run (report-only)
        working-directory: contrib/terraform
        run: "$(go env GOPATH)/bin/golangci-lint run --timeout=9m ./... || echo '::warning::golangci-lint reported findings (advisory)'"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      - run: go test ./...
      # Run the Bedrock packages under the race detector so their concurrency
      # tests (guardrail versions, evaluation-job stop, etc.) actually exercise
      # -race in CI rather than being inert.
      - run: go test -race ./providers/aws/bedrock/... ./server/aws/bedrock/... ./providers/aws/bedrockagent/... ./server/aws/bedrockagent/... ./server/aws/bedrockagentruntime/...

  race:
    name: Race (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      # Advisory whole-tree race detector. -race is 2-10x slower and much of the
      # codebase is not race-clean yet (mutable entities held as *T behind
      # memstore.Store have their fields mutated without per-entity sync), so this
      # is non-blocking for now: it surfaces data races as warnings while the
      # per-entity-mutex idiom (see SQS queueData.mu; use memstore.Update, never
      # Get+Set) is rolled out provider-by-provider. Flip to blocking once green.
      # Tracking: github issue "Architecture Theme 1".
      - name: go test -race ./... (advisory)
        run: go test -race -timeout 20m ./... || echo '::warning::go test -race reported findings (advisory; concurrency hardening in progress)'

  tidy:
    name: Tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  compat:
    name: Compat matrix
    runs-on: ubuntu-latest
    # Runs the in-process SDK-compat suite and regenerates docs/compat/ from the
    # results + docs/coverage/coverage.json, then drift-checks it (same pattern
    # as Tidy). A red cell fails the suite; a stale matrix fails the diff.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: regenerate compat matrix
        run: go run ./internal/compatgen
      - name: compat matrix is up to date
        run: git diff --exit-code docs/compat/

  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: naming & layout convention (docs/STRUCTURE.md)
        run: |
          # No cloud-prefixed directory at ANY depth under providers/<cloud> or
          # server/<cloud> — the parent aws/azure/gcp already encodes the cloud,
          # so the prefix is redundant (docs/STRUCTURE.md §2.2). Recursive so a
          # promoted sub-surface subdir (§4/§5) can't smuggle a prefix back in.
          fail=0
          for cloud in aws azure gcp; do
            for layer in providers server; do
              [ -d "$layer/$cloud" ] || continue
              for d in $(find "$layer/$cloud" -mindepth 1 -type d); do
                case "$(basename "$d")" in
                  "$cloud"?*)
                    echo "structure: '$d' has a redundant '$cloud' prefix — drop it (docs/STRUCTURE.md §2.2)"
                    fail=1 ;;
                esac
              done
            done
          done
          if [ "$fail" -ne 0 ]; then
            echo "Structure check failed. See docs/STRUCTURE.md."
            exit 1
          fi
          echo "structure: no cloud-prefixed provider/wire directories — OK"
      - name: same filename across layers (docs/STRUCTURE.md §3, advisory)
        run: |
          # STRUCTURE.md §3: a feature uses the same filename across the
          # provider and wire layers, so one filename finds both the mock and
          # the wire handler. Checked loosely — anywhere under server/<cloud>/,
          # not necessarily the same <service> subdir, since a sub-surface can
          # legitimately live under a differently-named service on each side
          # (e.g. providers/aws/vpc/traffic_mirror.go /
          # server/aws/ec2/traffic_mirror.go). Exempts each service's own
          # core-CRUD file plus clone.go/tags.go — the per-directory template
          # (§4) documents these as provider-only. Advisory: real pre-existing
          # drift (renamed files, provider-only helpers) means this warns
          # rather than fails a build.
          missing=0
          for cloud in aws azure gcp; do
            provdir="providers/$cloud"
            srvdir="server/$cloud"
            [ -d "$provdir" ] || continue
            [ -d "$srvdir" ] || continue
            for f in $(find "$provdir" -mindepth 2 -name '*.go' ! -name '*_test.go' ! -path '*/driver/*'); do
              base=$(basename "$f")
              svc=$(basename "$(dirname "$f")")
              case "$base" in
                "$svc.go"|clone.go|tags.go) continue ;;
              esac
              if ! find "$srvdir" -name "$base" ! -name '*_test.go' | grep -q .; then
                echo "structure: $f has no same-named file anywhere under $srvdir/ (docs/STRUCTURE.md §3)"
                missing=$((missing + 1))
              fi
            done
          done
          echo "structure: $missing provider file(s) with no same-named wire-layer file"
          if [ "$missing" -gt 0 ]; then
            echo "::warning::$missing provider file(s) lack a same-named file under server/<cloud>/ (docs/STRUCTURE.md §3, advisory)"
          fi

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt (report-only)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::warning::gofmt needed on the following files (advisory):"
            echo "$unformatted"
          else
            echo "all files gofmt-clean"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: install golangci-lint v2
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin"
      - name: golangci-lint run (report-only)
        run: "$(go env GOPATH)/bin/golangci-lint run --timeout=9m ./... || echo '::warning::golangci-lint reported findings (advisory)'"
