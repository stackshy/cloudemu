name: Release

# On a version tag, build cross-platform binaries + checksums and publish a
# GitHub Release via GoReleaser. Runs alongside docker.yml (which also fires on
# v* tags to publish the image) as an independent job — they share no state.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the Release and upload assets

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags — required for the changelog and version
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the Homebrew formula to github.com/stackshy/homebrew-tap.
          # MAINTAINER PREREQUISITE (one-time): add a repo secret named
          # HOMEBREW_TAP_TOKEN — a PAT with write access to the tap repo.
          # Without it the release still publishes; only the brew push is skipped.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
