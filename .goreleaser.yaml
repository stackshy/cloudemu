# GoReleaser v2 — builds the cloudemu CLI for every OS/arch and publishes a
# GitHub Release with checksums on each `v*` tag. Test locally with:
#   go run github.com/goreleaser/goreleaser/v2@latest check
#   go run github.com/goreleaser/goreleaser/v2@latest release --snapshot --clean --skip=publish
version: 2

project_name: cloudemu

before:
  hooks:
    - go mod tidy

builds:
  - id: cloudemu
    main: ./cmd/cloudemu
    binary: cloudemu
    env:
      - CGO_ENABLED=0 # pure-Go → static, portable binaries
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}} # CommitDate → reproducible across re-runs
      - -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: cloudemu
    ids:
      - cloudemu
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto # a pre-release tag (v1.2.0-rc1) is marked pre-release
